name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install PyNaCl pytest

      - name: Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract inline JS
        run: python tools/check_inline_js.py --out-dir /tmp/inline-js

      - name: Syntax-check worker JS
        run: node --check /tmp/inline-js/worker.js

      - name: Syntax-check main inline JS
        run: node --check /tmp/inline-js/main.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          sudo -n playwright install-deps chromium

      - name: Browser smoke test
        run: python tools/smoke_browser.py
