name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        # Pillow is optional: it enables the full icon-decode test and lets CI
        # prove the committed icons match tools/make_icons.py exactly.
        run: pip install PyNaCl pytest Pillow

      - name: Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract inline JS
        run: python tools/check_inline_js.py --out-dir /tmp/inline-js

      - name: Syntax-check worker JS
        run: node --check /tmp/inline-js/worker.js

      - name: Syntax-check main inline JS
        run: node --check /tmp/inline-js/main.js

      # Behaviour tests: actually EXECUTE the extracted page + worker JS so
      # logic regressions (time formatting, pluralisation, libsodium readiness
      # race) fail CI. `node --check` cannot catch any of those.
      - name: Page/worker JS behaviour tests
        run: node tools/test_page_js.mjs /tmp/inline-js/main.js /tmp/inline-js/worker.js

      # Proves the mining loop's arithmetic is exactly equivalent to the
      # BigInt/hex reference (including 2**256 carry propagation).
      - name: Worker math equivalence
        run: node tools/verify_worker_math.mjs

      # Guards the ~1400x wrapper-overhead regression: the shipped worker used
      # to yield per 16 candidates and rebuild hex strings per candidate.
      - name: Worker throughput benchmark
        run: node tools/bench_worker.mjs /tmp/inline-js/worker.js

      # Proves the reported (publicKey, privateKey) pair really is a usable
      # Ed25519 keypair, pinned to RFC 8032 test vector 1. Nothing else checks
      # this: the miner reports the 32-byte seed as the private key, and a
      # mismatch would produce keys that match the pattern but cannot sign.
      - name: Keypair validity (sign/verify + RFC 8032 vector)
        run: node tools/verify_keypair.mjs

      # Records WHY the hot loop cannot be made faster at the wrapper level
      # (~99% of a candidate is the scalar multiplication) and how the CLI
      # scales on this host. Not a gate; it fails the build only if the tool
      # itself breaks.
      - name: Mining cost breakdown and parallel scaling
        run: python tools/bench_mining.py

  # REQUIRED GATE, not advisory.
  #
  # Every other check in this workflow runs the extracted page JS inside a
  # Node vm against mocks. None of them exercise real libsodium WASM, real Web
  # Workers, real localStorage, or a real DOM. This job is the only thing that
  # can prove the app actually works in a browser, so a green `test` job says
  # nothing on its own about whether the page runs.
  #
  # `needs: test` keeps it fast (only runs when the cheap checks pass) while
  # `smoke` remains a job that must succeed for the workflow to pass. Dropping
  # the `needs` or renaming this job back to something advisory would be a
  # regression in itself.
  smoke:
    name: Browser smoke (required)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          sudo -n playwright install-deps chromium

      - name: Browser smoke test
        run: python tools/smoke_browser.py
